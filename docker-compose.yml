services:
  mysql:
    image: mysql:8.0
    container_name: mr_mailer_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: mr_mailer
      MYSQL_USER: mr_mailer_app
      MYSQL_PASSWORD: devpassword
    ports:
      - "3306:3306"
    volumes:
      - mr_mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: mr_mailer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: mr_mailer_web
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    # Secrets live in the host's .env, which is excluded from the image by
    # .dockerignore, so they are injected at run time rather than baked in.
    # Without this the container sets NODE_ENV=production and getSessionSecret()
    # throws on the missing SESSION_SECRET, so it crash-loops before serving.
    env_file:
      - .env
    environment:
      # These override env_file so the containers talk to the compose services
      # rather than to localhost, which is a different host inside a container.
      DATABASE_URL: mysql://mr_mailer_app:devpassword@mysql:3306/mr_mailer
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      # Node inside the image defaults to UTC; both the digest cron schedule and
      # the dashboard's meeting times are derived from Intl's resolved zone.
      TZ: Europe/Budapest
    ports:
      - "3000:3000"

  worker:
    build: .
    container_name: mr_mailer_worker
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    command: npm run worker
    # The worker decrypts stored OAuth tokens and calls Groq, so it needs the
    # same secrets as the web container.
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://mr_mailer_app:devpassword@mysql:3306/mr_mailer
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      TZ: Europe/Budapest

volumes:
  mr_mysql_data: